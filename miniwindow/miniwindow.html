<!DOCTYPE html>
<html>
  <div class="header">
      <span>Упрощение текста</span>
  </div>
  <div class="content">
      <div id="source-text-display" style="color: #666; font-size: 12px;"></div>
      <textarea id="source-area" placeholder="Тут будет изначальный текст"" style="width: 280px; resize: vertical;"></textarea>
      <textarea id="result-area" placeholder="Тут будет адаптированный текст..." style="width: 280px; resize: vertical;""></textarea>
  </div>
  <div class="footer">
			<select id="level" name="level">
				<option value="clear">Проще и понятнее</option>
				<option value="quick">Коротко и по делу</option>
				<option value="notes">Для конспекта</option>
			</select>
      <button id="submit-button">Перевести</button>
  </div>
</html>
